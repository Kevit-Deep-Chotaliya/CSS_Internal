<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Navigation bar</title>
        <style>
        * {
            box-sizing: border-box;
        }
        .nav-menu {
            display: flex;
            gap: 20px;
            justify-content: flex-start;
            width: 100%;    
            min-width: 1000px;
        }
        .nav-menu > li{
           position: relative;
           cursor: pointer;
           font-weight: bold;
           list-style: none;
        }
        .nav-menu ul {
            list-style: none;
            position: absolute;
            top: 100%;
            left: 0;
            background-color: #fff;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 8px 0;
            display: none;
            min-width: 120px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 1);
        }
        .nav-menu > li:hover > ul{
            display: block;
        }
        .nav-menu ul li {
            padding: 8px 16px;
            font-weight: normal;
        }
        .nav-menu ul li:hover {
            background: #f0f0f0;
        }
    </style>
    </head>
    <body>
        <nav>
            <ul class="nav-menu">
                <li>Home</li>
                <li>About</li>
                <li>Categoty
                    <ul>
                        <li>Category 1</li>
                        <li>Category 2</li>
                        <li>Category 3</li>
                    </ul>
                </li>
            </ul>
        </nav>
    </body>
</html>
