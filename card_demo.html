<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Responsive Card Layout</title>
    <style>
      .card {
        width: 100%;
        max-width: 300px;
        padding: 24px;
        border: 1px solid #ddd;
        border-radius: 8px;
        margin: 16px auto;
        background-color: white;
        box-shadow: 0 2px 4px 22px rgba(0, 0, 0, 0.1);
      }

      .card-title {
        margin: 0 0 12px 0;
        font-size: 1.25rem;
        font-weight: bold;
      }

      .card-content {
        margin: 0;
        line-height: 1.;
        color: #666;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h3 class="card-title">Product Feature</h3>
      <p class="card-content">
        This card demonstrates how the box model creates consistent spacing and
        structure in component-based designs.
      </p>
    </div>
  </body>
</html>
